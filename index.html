<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>やさしい YouTube プレイヤー</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="interestSetupOverlay" class="interest-setup-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="interestSetupTitle">
      <div class="interest-setup-panel">
        <p class="interest-setup-label">はじめの設定</p>
        <h1 id="interestSetupTitle">興味のあるタグを選んでください</h1>
        <p>1つ以上選ぶと、お好みに合った動画を探せます。</p>
        <div id="interestTagList" class="interest-tag-list"></div>
        <button id="interestSetupButton" class="interest-setup-button" type="button" disabled>はじめる</button>
      </div>
    </div>
    <div id="settingsOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <section class="modal-panel">
        <button id="settingsCloseButton" class="modal-close" type="button">閉じる</button>
        <h2 id="settingsTitle">設定</h2>
        <div class="settings-actions">
          <button id="historyButton" type="button">視聴履歴</button>
          <button id="channelHistoryButton" type="button">チャンネル一覧</button>
          <button id="editTagsButton" type="button">タグリストの編集</button>
          <button id="editChannelsButton" type="button">チャンネル一覧の編集</button>
          <button id="controlSizeToggle" type="button" aria-pressed="false">ボタンサイズ切り替え</button>
          <button id="clearTagsButton" type="button" class="danger-button">タグリストを全消去</button>
          <button id="clearChannelsButton" type="button" class="danger-button">チャンネルリストを全消去</button>
        </div>
      </section>
    </div>
    <div id="historyOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <section class="modal-panel modal-panel-wide">
        <button id="historyBackButton" class="modal-back" type="button">戻る</button>
        <h2 id="historyTitle">視聴履歴</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </div>
    <div id="channelHistoryOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="channelHistoryTitle">
      <section class="modal-panel modal-panel-wide">
        <button id="channelHistoryBackButton" class="modal-back" type="button">戻る</button>
        <h2 id="channelHistoryTitle">チャンネル一覧</h2>
        <div id="channelHistoryList" class="history-list"></div>
      </section>
    </div>
    <div id="tagEditOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="tagEditTitle">
      <section class="modal-panel modal-panel-wide">
        <button id="tagEditBackButton" class="modal-back" type="button">戻る</button>
        <button id="tagEditSaveButton" class="modal-save" type="button">保存</button>
        <h2 id="tagEditTitle">タグリストの編集</h2>
        <div id="tagEditList" class="interest-tag-list tag-edit-list"></div>
        <div class="tag-edit-actions">
          <button id="tagDoubleButton" type="button">x2.0</button>
          <button id="tagHalfButton" type="button">x0.5</button>
          <button id="tagDeleteButton" type="button" class="danger-button">削除</button>
        </div>
        <div id="channelEditOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="channelEditTitle">
          <section class="modal-panel modal-panel-wide">
            <button id="channelEditBackButton" class="modal-back" type="button">戻る</button>
            <button id="channelEditSaveButton" class="modal-save" type="button">保存</button>
            <h2 id="channelEditTitle">チャンネル一覧の編集</h2>
            <div id="channelEditList" class="interest-tag-list tag-edit-list"></div>
            <div class="tag-edit-actions">
              <button id="channelDoubleButton" type="button">x2.0</button>
              <button id="channelHalfButton" type="button">x0.5</button>
              <button id="channelDeleteButton" type="button" class="danger-button">削除</button>
            </div>
          </section>
        </div>
      </section>
    </div>
    <main class="app-shell">
      <section class="player-section" aria-label="動画プレイヤー">
        <div class="player-frame">
          <iframe id="player" class="player-embed" title="ユーチューブプレイヤー" allow="autoplay; fullscreen"></iframe>
          <div id="previewOverlay" class="preview-overlay hidden" aria-live="polite">
            <img id="previewImage" class="preview-image" alt="次に流れる動画のサムネイル" />
            <div class="preview-copy">
              <p class="preview-label">まもなく再生します</p>
              <h2 id="previewTitle"></h2>
              <p id="previewMeta"></p>
            </div>
          </div>
          <div id="authOverlay" class="auth-overlay hidden" aria-live="polite">
            <div class="auth-panel">
              <p class="auth-label">認証が必要です</p>
              <h2>Google アカウントで続行してください</h2>
              <p>YouTube の人気動画を表示するために、認証画面へ進みます。</p>
              <button id="authButton" class="auth-button" type="button">認証画面へ進む</button>
            </div>
          </div>
        </div>
      </section>

      <section class="control-section" aria-label="操作ボタン">
        <div class="controls-row">
          <button id="playToggle" class="control-button primary-button" type="button">
            <span class="control-emoji">▶️</span><span class="control-label">再生</span>
          </button>

          <div class="control-button volume-panel" aria-label="音量操作">
            <button id="volumeDown" class="mini-button" type="button" aria-label="音量を下げる">➖</button>
            <span class="volume-level"><span class="control-emoji">🎵</span><span id="volumeLevel" class="control-label">5</span></span>
            <button id="volumeUp" class="mini-button" type="button" aria-label="音量を上げる">➕</button>
          </div>

          <button id="moreButton" class="control-button" type="button">
            <span class="control-emoji">💘</span><span class="control-label">もっと 見る</span>
          </button>
          <button id="discoverButton" class="control-button primary-button" type="button">
            <span class="control-emoji">🔍</span><span class="control-label">探す</span>
          </button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
