<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>やさしい YouTube プレイヤー</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="auth-header" aria-label="ログイン状態">
        <div id="loginSection" class="auth-guest">
          <p class="auth-description">Googleアカウントでログインすると登録チャンネルの動画が楽しめます</p>
          <button id="loginButton" class="auth-button" type="button">🔑 Googleでログイン</button>
        </div>
        <div id="userSection" class="auth-user hidden">
          <span id="userDisplayName" class="auth-name"></span>
          <button id="logoutButton" class="auth-button auth-button-sm" type="button">ログアウト</button>
        </div>
      </header>

      <section class="player-section" aria-label="動画プレイヤー">
        <div class="player-frame">
          <iframe id="player" class="player-embed" title="ユーチューブプレイヤー" allow="autoplay; fullscreen" allowfullscreen></iframe>
          <div id="previewOverlay" class="preview-overlay hidden" aria-live="polite">
            <img id="previewImage" class="preview-image" alt="次に流れる動画のサムネイル" />
            <div class="preview-copy">
              <p class="preview-label">まもなく再生します</p>
              <h2 id="previewTitle"></h2>
              <p id="previewMeta"></p>
            </div>
          </div>
        </div>
      </section>

      <section class="control-section" aria-label="操作ボタン">

        <div class="controls-row">
          <button id="playToggle" class="control-button primary-button" type="button">▶️<br>再生</button>

          <div class="control-button volume-panel" aria-label="音量操作">
            <span class="panel-title">🎵音量</span>
            <div class="volume-row">
              <button id="volumeDown" class="mini-button" type="button" aria-label="音量を下げる">➖</button>
              <span id="volumeLevel" class="volume-level">5</span>
              <button id="volumeUp" class="mini-button" type="button" aria-label="音量を上げる">➕</button>
            </div>
          </div>

          <button id="captionToggle" class="control-button" type="button">💬<br>字幕❌</button>
          <button id="likeToggle" class="control-button" type="button">❤️<br>好み</button>
          <button id="prevButton" class="control-button" type="button">⏪<br>前</button>
          <button id="nextButton" class="control-button primary-button" type="button">📺<br>次</button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
